<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self' data:"><title>Superstring</title><link rel="stylesheet" href="superstring://startup/appearance.css">
<style>
:root{color-scheme:light;--bg:var(--background);--ink:var(--foreground);--accent:var(--primary);--line:var(--border)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{min-height:calc(100svh / var(--app-interface-scale,1));font:calc(14px * var(--app-text-scale,1))/1.5 var(--app-font-family);background:var(--bg);color:var(--ink);display:grid;place-items:center;-webkit-app-region:drag}.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 40% 36%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%)}main{width:min(460px,calc(100% - 48px));text-align:center;padding:40px 24px;border-radius:12px;position:relative;-webkit-app-region:no-drag}.mark{width:84px;height:84px;margin:auto;color:var(--accent);filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--accent) 25%,transparent))}.mark svg{width:100%;height:100%}h1{font-size:calc(30px * var(--app-text-scale,1));letter-spacing:-.035em;font-weight:600;margin:22px 0 12px}p{color:var(--muted-foreground);min-height:42px;white-space:pre-wrap;overflow-wrap:anywhere}.ring{margin:22px auto;width:26px;height:26px;border:2px solid color-mix(in srgb,var(--accent) 20%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.actions{display:flex;justify-content:center;gap:10px}button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:transparent;padding:8px 18px;cursor:pointer}button:first-child{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body><div class="ambient"></div><main><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>Superstring</title>

  <g id="mark" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="1.7" d="M7.6 10h8.8a1.6 1.6 0 0 1 1.6 1.6V17a1.6 1.6 0 0 1-1.6 1.6h-6.9l-1.9 1.9v-1.9A1.6 1.6 0 0 1 6 17v-5.4A1.6 1.6 0 0 1 7.6 10Z"/>
    <g stroke-width="1.3">
      <path d="M1.85 3.55c-.38 .57-.6175 1.1875-.7125 1.8525c.38-.0475 .7125-.266 .931-.57"/>
      <path d="M3.7025 3.55c-.38 .57-.6175 1.1875-.7125 1.8525c.38-.0475 .7125-.266 .931-.57"/>
      <path d="M20.2975 5.4025c.38-.57 .6175-1.1875 .7125-1.8525c-.38 .0475-.7125 .266-.931 .57"/>
      <path d="M22.15 5.4025c.38-.57 .6175-1.1875 .7125-1.8525c-.38 .0475-.7125 .266-.931 .57"/>
    </g>
    <path stroke-width="1.4" d="M7.95 14.85C8.6 14.85 8.775 13.1 10.065 13.1C10.71 13.1 11.355 13.5 12 14.3C12.645 15.1 13.29 15.5 13.935 15.5C15.225 15.5 15.4 13.75 16.05 13.75"/>
    <circle cx="10.065" cy="13.1" r="1.6" fill="currentColor" stroke="none"/>
    <circle cx="13.935" cy="15.5" r="1.6" fill="currentColor" stroke="none"/>
  </g>
</svg></div><h1>Superstring</h1><div class="ring" role="presentation"></div><p id="status" role="status"></p><div class="actions" hidden><button id="retry" type="button"></button><button id="logs" type="button"></button></div></main>
<script>
const host=window.superstringHost,main=document.querySelector('main'),reduceQuery=matchMedia('(prefers-reduced-motion:reduce)');
const status=document.querySelector('#status'),retry=document.querySelector('#retry'),logs=document.querySelector('#logs');
const preferenceStyle=document.createElement('style');document.head.append(preferenceStyle);
function labels(locale){const zh=locale==='zh-CN';document.documentElement.lang=zh?'zh-CN':'en';retry.textContent=zh?'重试':'Retry';logs.textContent=zh?'查看日志':'Open logs';if(!status.textContent)status.textContent=zh?'正在打开工作区…':'Opening your workspace…'}
labels(navigator.language.startsWith('zh')?'zh-CN':'en');
let animation=0;
function settle(){cancelAnimationFrame(animation);main.style.transform='none';main.style.opacity='1'}
if(!reduceQuery.matches){let x=.72,v=0,last;const frame=(t)=>{if(reduceQuery.matches){settle();return}if(last===undefined)last=t;const dt=Math.min((t-last)/1000,.025);last=t;v+=((1-x)*260-v*18)/.85*dt;x+=v*dt;main.style.transform=`scale(${x})`;main.style.opacity=Math.min(1,Math.max(0,(x-.72)/.28));if(Math.abs(1-x)>.001||Math.abs(v)>.01)animation=requestAnimationFrame(frame);else settle()};animation=requestAnimationFrame(frame)}
reduceQuery.addEventListener('change',()=>{if(reduceQuery.matches)settle()});
host?.onStartupState(state=>{if(state.phase==='handoff'){settle();return}const p=state.presentation;if(p){const root=document.documentElement;root.dataset.theme=p.theme;root.dataset.mode=p.mode;root.dataset.font=p.font;root.dataset.textSize=p.textSize;root.dataset.interfaceSize=p.interfaceSize;root.classList.toggle('dark',p.dark);root.style.colorScheme=p.dark?'dark':'light';preferenceStyle.textContent=p.css;labels(p.locale)}status.textContent=state.message;document.querySelector('.ring').hidden=state.phase==='failed';document.querySelector('.actions').hidden=state.phase!=='failed'});
retry.onclick=()=>host?.retry();logs.onclick=()=>host?.openLogs();
</script></body></html>
