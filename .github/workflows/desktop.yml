name: Desktop packages

on:
  push:
    branches: [feat/cross-platform-desktop]
  pull_request:
    paths:
      - src/**
      - migrations/**
      - tools/**
      - tests/desktop/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (required for a release)
        type: string
        required: false
      release:
        description: Build signed packages and create a draft release for this existing tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Verify requested version and commit
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {version}=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(process.env.RELEASE==='true' && process.env.REQUESTED_TAG!==`v${version}`) throw new Error('Release requires the existing v<package version> tag');
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\ncommit=${commit}\n`);
          JS
      - name: Packaging contract tests (no runtime downloads)
        run: node --test tests/desktop/packaging.test.mjs
      - name: Install source validation dependencies without Electron runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Type and migration inventory gates
        run: |
          npm run typecheck
          node_modules/.bin/bun tools/verify/verify-migration-inventory.mjs
      - name: Desktop contracts and existing startup invariants
        run: >-
          node_modules/.bin/bun test
          tests/desktop/*.test.ts
          tests/integration/desktop-*.test.ts
          tests/integration/app-paths.test.ts
          tests/integration/brand-assets.test.ts
          tests/integration/posix-launcher.test.ts

  packages:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Linux desktop runtime dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libnotify4 libsecret-1-0
      - name: Prepare notarization key
        if: matrix.platform == 'darwin' && inputs.release
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          if(!process.env.APPLE_API_KEY_BASE64) throw new Error('APPLE_API_KEY_BASE64 is required for a signed release');
          const file=path.join(process.env.RUNNER_TEMP,'superstring-notary.p8');
          fs.writeFileSync(file,Buffer.from(process.env.APPLE_API_KEY_BASE64,'base64'),{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,`APPLE_API_KEY=${file}\n`);
          JS
      - name: Package native desktop
        env:
          CSC_LINK: ${{ matrix.platform == 'darwin' && inputs.release && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && inputs.release && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'darwin' && inputs.release && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'darwin' && inputs.release && secrets.APPLE_API_ISSUER || '' }}
        run: node tools/desktop/build/cross-platform/build.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} ${{ inputs.release && '--release' || '' }}
      - name: macOS distribution and packaged launch
        if: matrix.platform == 'darwin'
        env:
          PACKAGE_DIR: dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          hdiutil verify "$PACKAGE_DIR/"*.dmg
          ditto -x -k "$PACKAGE_DIR/"*.zip "$RUNNER_TEMP/Superstring packaged smoke"
          node tools/desktop/build/cross-platform/smoke.mjs "$PACKAGE_DIR" --app "$RUNNER_TEMP/Superstring packaged smoke/superstring.app"
      - name: Linux installed DEB launch with the Chromium sandbox
        if: matrix.platform == 'linux'
        env:
          PACKAGE_DIR: dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          sudo apt-get install -y "$PWD/$PACKAGE_DIR/"*.deb
          xvfb-run -a node tools/desktop/build/cross-platform/smoke.mjs "$PACKAGE_DIR" --app /opt/Superstring
      - name: AppImage payload verification without FUSE
        if: matrix.platform == 'linux'
        env:
          PACKAGE_DIR: dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          IMAGE=$(realpath "$PACKAGE_DIR/"*.AppImage)
          mkdir -p "$RUNNER_TEMP/appimage-check"
          cd "$RUNNER_TEMP/appimage-check"
          "$IMAGE" --appimage-extract > /dev/null
          cmp squashfs-root/resources/app.asar /opt/Superstring/resources/app.asar
          cmp squashfs-root/resources/service/superstring-server /opt/Superstring/resources/service/superstring-server
          cmp squashfs-root/resources/service/resource-manifest.json /opt/Superstring/resources/service/resource-manifest.json
      - name: Remove temporary signing key
        if: always() && matrix.platform == 'darwin'
        run: rm -f "$RUNNER_TEMP/superstring-notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/build-result.json
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/smoke-report.json
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/smoke-process.json
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/smoke-logs/**
            dist/desktop-packages/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Existing Windows C# package chain
        run: node tools/installer/build-package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win32-x64
          path: dist/installers/superstring-setup-*.exe
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [source, packages, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/desktop-downloads
      - name: Check complete asset set and final byte hashes
        run: node tools/desktop/build/cross-platform/release-assets.mjs artifacts/desktop-downloads dist/desktop-release '${{ needs.source.outputs.version }}' ${{ inputs.release && '--release' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.release && 'signed-desktop-release' || 'desktop-validation-only' }}
          path: dist/desktop-release/*
          retention-days: 7
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [source, assemble]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-desktop-release
          path: dist/desktop-release
      - name: Create explicit existing-tag draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Superstring $RELEASE_TAG" --notes "Native desktop distributions. See SHA256SUMS and per-platform smoke reports. macOS packages are signed and notarized; Windows retains its existing installer chain." dist/desktop-release/*
